<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171526"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./game.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><title>月下猫行 · 横屏远征</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#161426;overflow:hidden}#arena{--mint:#c8ffd6;--gold:#ffce84;position:fixed;inset:0;width:100vw;height:100vh;width:100dvw;height:100dvh;overflow:hidden;isolation:isolate;color:#fff6e8;font:600 15px system-ui,"PingFang SC",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;background:#2c2844}
@media(orientation:portrait){#arena{width:100vh;height:100vw;width:100dvh;height:100dvw;inset:0 auto auto 0;transform-origin:top left;transform:translateX(100vw) rotate(90deg);transform:translateX(100dvw) rotate(90deg)}}
#world{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}.hud,nav,.pad,.action{position:absolute;display:flex;align-items:center;gap:8px;z-index:2}#arena button{font:inherit;color:inherit;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}#arena [hidden]{display:none!important}.hud{top:max(12px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));background:#201c32e8;border:1px solid #96849c72;padding:7px 14px;border-radius:5px;box-shadow:0 3px #19162455;gap:12px}.hud b,#eyebrow{font:700 12px ui-monospace,monospace;letter-spacing:1.6px;color:var(--mint)}#life{color:#ffa0a7}#wallet{color:var(--gold)}nav{top:max(12px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right))}nav button,#close{border:1px solid #8d7b93;background:#282338e8;border-radius:6px;min-height:40px;min-width:42px;padding:4px 9px}.progress{height:2px;background:#ffffff18;position:absolute;bottom:0;width:100%;z-index:4}#progress{display:block;height:100%;background:var(--mint)}
.pad,.action{bottom:max(14px,env(safe-area-inset-bottom));gap:10px}.pad{left:max(16px,env(safe-area-inset-left))}.action{right:max(16px,env(safe-area-inset-right))}.pad button,.action button{border:1px solid #d6c3c482;background:#252235cd;border-radius:17px;min-width:62px;height:53px;box-shadow:inset 0 -4px #120f1d55;font-weight:800!important}.pad button{font-size:22px!important}.action #attack{border-color:#ffd297;color:#ffe2b6;background:#5a4038ed}.action #roll{color:#c1eaff}.on,.pad button:active,.action button:active{filter:brightness(1.6)}#roll:disabled{opacity:.6}#hint{position:absolute;bottom:4px;left:0;width:100%;pointer-events:none;text-align:center;font-size:12px;color:#e5d8df}
#overlay{position:absolute;inset:0;display:flex;align-items:center;padding:52px 7%;background:linear-gradient(90deg,#1b182de8 0%,#25213bb3 48%,#2d233900 90%);z-index:3;pointer-events:none}#overlay button,#draft{pointer-events:auto}.copy{width:100%}#title{font-size:clamp(31px,6vw,76px);line-height:1.06;margin:7px 0;letter-spacing:.07em;text-shadow:0 3px #2f223d}#desc{font-size:clamp(13px,1.8vw,18px);line-height:1.5;max-width:46em;margin:6px 0 14px;color:#f5e8dc}#start{color:#25352e!important;border:0;border-radius:7px;box-shadow:0 4px #62856b;background:#ceffd6;padding:11px 22px}#draft{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-width:820px;gap:10px}#draft:empty{display:none}#draft button{display:grid;gap:6px;text-align:left;align-content:center;padding:12px 14px;background:#231e34f2;border:1px solid #b091ac;border-top:3px solid var(--gold);border-radius:7px}#draft button:nth-child(2){border-top-color:#bce7fc}#draft button:nth-child(3){border-top-color:#e4b2ff}#draft button:hover{background:#46334d}#draft strong{font-size:17px}#draft small{font:500 13px/1.4 system-ui;color:#e0d5e1}#arena:has(#overlay:not([hidden])) .pad,#arena:has(#overlay:not([hidden])) .action,#arena:has(#overlay:not([hidden])) #hint{visibility:hidden}
#map{position:absolute;z-index:8;inset:5% auto auto 50%;transform:translateX(-50%);width:min(620px,92%);max-height:90%;overflow:auto;touch-action:pan-y;background:#292338;color:#fff4e6;border:1px solid #aa8da4;border-radius:12px;padding:15px 20px;margin:0}#map h2,#map p{margin:0 0 7px}#map p{font-size:13px}#choices{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px}#choices button{background:#373045;border:1px solid #655970;border-radius:5px;min-height:36px;font-size:13px}button:disabled{opacity:.5}#rack{max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#dac7eb;font-size:12px}#rack:empty{display:none}
@media(max-height:500px),(orientation:portrait){#hint{display:none}#title{font-size:32px}#desc{margin:4px 0 8px;font-size:13px}#draft button{padding:8px 10px}#overlay{padding:48px 6% 18px}.hud{gap:8px}#rack{max-width:135px}}
#arena:has(#map[open])>:not(#map){pointer-events:none}#map{touch-action:pan-y}#arena:has(#map[open]){touch-action:pan-y} </style></head><body><main id="arena"><canvas id="world" aria-label="月下猫行横屏战场"></canvas><div class="hud"><b id="num"></b><strong id="place"></strong><span id="life"></span><span id="wallet">◆ <span id="count"></span></span><span id="rack"></span></div><nav><button id="routes">手记</button><button id="sound" aria-label="音效">♪</button><button id="pause" aria-label="暂停">Ⅱ</button></nav><section id="overlay"><div class="copy"><div id="eyebrow"></div><h1 id="title"></h1><p id="desc"></p><div id="draft"></div><button id="start"></button></div></section><div class="pad"><button id="left" aria-label="向左">◀</button><button id="right" aria-label="向右">▶</button></div><div class="action"><button id="roll">翻滚</button><button id="jump">跳跃</button><button id="attack">爪击</button></div><span id="hint"></span><div class="progress"><i id="progress"></i></div><dialog id="map"><h2>夜行手记</h2><p id="journal"></p><p id="build"></p><p id="supplies"></p><div id="choices"></div><button id="close">返回</button></dialog></main><script src="stages.js"></script><script src="expedition.js"></script><script src="art.js"></script><script src="game.js"></script><script src="install.js"></script></body></html>
